plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.odelly.pypet'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.odelly.pypet'
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName '0.1.0-beta6'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }

        buildConfigField 'String', 'PURCHASE_VERIFICATION_URL', '"' + (project.findProperty('pypetPurchaseVerifyUrl') ?: '') + '"'
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'REWARDED_AD_UNIT_ID', '"ca-app-pub-3940256099942544/5224354917"'
        }
        release {
            minifyEnabled false
            buildConfigField 'String', 'REWARDED_AD_UNIT_ID', '"ca-app-pub-3352973554477677/6771650805"'
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.13'
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.android.billingclient:billing:9.1.0'
}
