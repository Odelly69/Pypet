name: Pypet Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'api/**'
      - 'package.json'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'api/**'
      - 'package.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Python test runner
        run: python -m pip install pytest
      - name: Run Python world and curriculum tests
        run: PYTHONPATH=app/src/main/python pytest app/src/test/python -q
      - name: Verify real building activity routing and teaching gate
        run: |
          set -e
          manager=app/src/main/java/com/odelly/pypet/BuildingEventManager.java
          gate=app/src/main/java/com/odelly/pypet/BuildingLearningGateView.java
          activity=app/src/main/java/com/odelly/pypet/BuildingActivityView.java
          grep -q 'case "PYTHON ACADEMY": PypetAcademyActivityView.show' "$manager"
          grep -q 'BuildingLearningGateView.show' "$manager"
          grep -q 'public static void show' "$gate"
          grep -q 'RUN REAL PYTHON' "$gate"
          grep -q 'lessonFor' "$gate"
          grep -q 'missionComplete' "$gate"
          grep -q 'public static void home' "$activity"
          grep -q 'public static void market' "$activity"
          grep -q 'public static void workshop' "$activity"
          grep -q 'public static void park' "$activity"
          grep -q 'public static void library' "$activity"
      - name: Verify no legacy building description popup
        run: |
          ! grep -R -n 'new AlertDialog' app/src/main/java/com/odelly/pypet/BuildingActivityView.java app/src/main/java/com/odelly/pypet/BuildingEventManager.java app/src/main/java/com/odelly/pypet/BuildingLearningGateView.java
      - name: Verify World acceptance requirements
        run: |
          set -e
          world=app/src/main/java/com/odelly/pypet/LivingWorldView.java
          placement=app/src/main/java/com/odelly/pypet/WorldPlacementManager.java
          grep -q 'tap a building to DO the activity' "$world"
          grep -q 'Math.max(getWidth()/W,getHeight()/H)' "$world"
          grep -q 'drawColor(Color.rgb(151,196,119))' "$world"
          grep -q 'frontDoor' "$world"
          grep -q 'private void window' "$world"
          grep -q 'groundY' "$world"
          grep -q 'PetWorldAI.State' "$world"
          grep -q 'HALF=1200f' "$placement"
          grep -q 'ROAD_BLOCK=205f' "$placement"
          grep -q 'void placeUnique' "$placement"
          grep -q 'RewardCenterView.show' app/src/main/java/com/odelly/pypet/BuildingActivityView.java
          grep -q 'TreasureStore.show' app/src/main/java/com/odelly/pypet/BuildingActivityView.java
          grep -q 'pauseForLifecycle' app/src/main/java/com/odelly/pypet/MainActivity.java
          grep -q 'Choose your avatar' app/src/main/java/com/odelly/pypet/PypetProfileView.java
      - name: Verify beginner-first Academy teaching and gated stages
        run: |
          set -e
          academy=app/src/main/java/com/odelly/pypet/PypetAcademyActivityView.java
          session=app/src/main/java/com/odelly/pypet/AcademyLessonSession.java
          grep -q 'No previous Python knowledge is required' "$academy"
          grep -q 'WORKED EXAMPLE' "$academy"
          grep -q 'I UNDERSTAND — SHOW EXAMPLE' "$academy"
          grep -q 'missionLooksComplete' "$academy"
          grep -q 'markLearned' "$session"
          grep -q 'markSeen' "$session"
          grep -q 'markInspected' "$session"
      - name: Verify egg hatching and same-lineage evolution
        run: |
          set -e
          evolution=app/src/main/java/com/odelly/pypet/PetEvolutionManager.java
          hatchery=app/src/main/java/com/odelly/pypet/PypetHatcheryView.java
          grep -q 'class Egg' "$evolution"
          grep -q 'HATCHED' "$evolution"
          grep -q 'hatchCurrentEgg' "$evolution"
          grep -q 'putBoolean(HATCHED,true)' "$evolution"
          grep -q 'putString(LINEAGE,e.lineage)' "$evolution"
          grep -q 'private static void evolve' "$evolution"
          grep -q 'variant(p(c).getString(LINEAGE' "$evolution"
          grep -q 'EGG → HATCHLING → GROWING FORM → ADVANCED FORM → MASTER FORM' "$hatchery"
          grep -q 'SAME' "$hatchery"
          grep -q 'Hatch this egg' "$hatchery"
          grep -q 'hatchCurrentEgg' "$hatchery"
      - name: Verify pet movement is obstacle-aware and grounded
        run: |
          set -e
          ai=app/src/main/java/com/odelly/pypet/PetWorldAI.java
          body=app/src/main/java/com/odelly/pypet/PetBodyModel.java
          grep -q 'randomWalkable' "$ai"
          grep -q 'walkable' "$ai"
          grep -q 'turnToward' "$ai"
          grep -q 'stepPhase' "$ai"
          grep -q '0xFF000000' "$body"
      - name: Verify purchase verifier is fail-closed
        run: |
          set -e
          verifier=../api/google-play/verify-purchase.js
          grep -q "treasure_crystal" "$verifier"
          grep -q "pypet_premium_ultimate_world" "$verifier"
          grep -q 'purchase.purchaseState!==0' "$verifier"
          grep -q 'consumptionState===1' "$verifier"
          grep -q 'acknowledge' "$verifier"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Verify debug APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Build production release APK
        run: gradle assembleRelease --stacktrace
      - name: Verify production release APK
        run: test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pypet-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload production release APK
        uses: actions/upload-artifact@v4
        with:
          name: pypet-android-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

# CI gate: every Android source/workflow change must produce verified APK artifacts and prove the World, taught building activities, beginner-first Academy, grounded pet movement, evolution, rewards/purchase safeguards, and profile/audio requirements are present.
