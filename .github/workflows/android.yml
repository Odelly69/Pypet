name: Pypet Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'api/**'
      - 'package.json'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'api/**'
      - 'package.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Python test runner
        run: python -m pip install pytest
      - name: Run Python world and curriculum tests
        run: PYTHONPATH=app/src/main/python pytest app/src/test/python -q
      - name: Verify product rules
        run: |
          set -e
          manager=app/src/main/java/com/odelly/pypet/BuildingEventManager.java
          home=app/src/main/java/com/odelly/pypet/PetHomeCareView.java
          academy=app/src/main/java/com/odelly/pypet/PypetAcademyActivityView.java
          curriculum=app/src/main/java/com/odelly/pypet/PypetCurriculum.java
          world=app/src/main/java/com/odelly/pypet/LivingWorldView.java
          placement=app/src/main/java/com/odelly/pypet/WorldPlacementManager.java
          activity=app/src/main/java/com/odelly/pypet/BuildingActivityView.java
          grep -Fq 'case "PYTHON ACADEMY": PypetAcademyActivityView.show' "$manager"
          grep -Fq 'case "HOME": PetHomeCareView.show' "$manager"
          grep -Fq 'case "WORKSHOP": BuildingActivityView.workshop' "$manager"
          grep -Fq 'case "PARK": BuildingActivityView.park' "$manager"
          grep -Fq 'case "MARKET": BuildingActivityView.market' "$manager"
          grep -Fq 'case "LIBRARY": BuildingActivityView.library' "$manager"
          ! grep -Fq 'BuildingLearningGateView.show' "$manager"
          grep -Fq 'currentLesson(mastered)' "$academy"
          grep -Fq 'completeLesson(a)' "$academy"
          grep -Fq 'lessonCount()' "$academy"
          grep -Fq 'currentLesson(int masteredCount)' "$curriculum"
          grep -Fq 'canStart(String id,int masteredCount)' "$curriculum"
          grep -Fq 'Swipe left/right to rotate rooms' "$home"
          grep -Fq 'DROP FOOD HERE' "$home"
          grep -Fq 'startDragAndDrop' "$home"
          grep -Fq 'ACTION_DROP' "$home"
          grep -Fq 'FRUIT' "$home"
          grep -Fq 'VEGETABLES' "$home"
          grep -Fq 'PROTEIN / FISH' "$home"
          grep -Fq 'TREATS' "$home"
          grep -Fq 'SOAP' "$home"
          grep -Fq 'SUDS' "$home"
          grep -Fq 'SHOWER' "$home"
          grep -Fq 'soaped[0]' "$home"
          grep -Fq 'PetCareSystem.bathe' "$home"
          grep -Fq 'Clean up waste' "$home"
          grep -Fq 'Complete daily care routine' "$home"
          grep -Fq 'tap a building to do its activity' "$world"
          grep -Fq 'workshop(c,-850,-940,-420,-620,3)' "$world"
          grep -Fq 'park(c,-1080,720,-220,1090,4)' "$world"
          grep -Fq 'house(c,420,760,850,1060,"HOME",0,Color.rgb(164,83,63))' "$world"
          grep -Fq 'PARK_T=720f' "$placement"
          grep -Fq 'PARK_B=1090f' "$placement"
          grep -Fq 'ROAD_BLOCK=205f' "$placement"
          grep -Fq 'inRect(x,y,250,720,910,1090,pad)' "$placement"
          ! grep -Fq 'LEARN BY DOING' "$activity"
      - name: Verify beginner-first Academy
        run: |
          set -e
          academy=app/src/main/java/com/odelly/pypet/PypetAcademyActivityView.java
          grep -Fq 'No previous Python knowledge is required' "$academy"
          grep -Fq 'WORKED EXAMPLE' "$academy"
          grep -Fq 'I UNDERSTAND — SHOW EXAMPLE' "$academy"
          grep -Fq 'missionLooksComplete' "$academy"
      - name: Verify egg evolution and pet movement
        run: |
          set -e
          evolution=app/src/main/java/com/odelly/pypet/PetEvolutionManager.java
          ai=app/src/main/java/com/odelly/pypet/PetWorldAI.java
          grep -Fq 'class Egg' "$evolution"
          grep -Fq 'HATCHED' "$evolution"
          grep -Fq 'hatchCurrentEgg' "$evolution"
          grep -Fq 'putString(LINEAGE,e.lineage)' "$evolution"
          grep -Fq 'randomWalkable' "$ai"
          grep -Fq 'walkable' "$ai"
          grep -Fq 'turnToward' "$ai"
      - name: Verify purchase verifier
        run: |
          set -e
          verifier=../api/google-play/verify-purchase.js
          grep -Fq 'treasure_crystal' "$verifier"
          grep -Fq 'pypet_premium_ultimate_world' "$verifier"
          grep -Fq 'purchase.purchaseState!==0' "$verifier"
          grep -Fq 'acknowledge' "$verifier"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Clean and build debug APK
        run: gradle clean assembleDebug --stacktrace
      - name: Verify debug APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare direct APK artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PyPet-debug.apk
      - name: Build release APK
        run: gradle assembleRelease --stacktrace
      - name: Verify release APK
        run: test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PyPet-debug-APK
          path: android/app/build/outputs/apk/debug/PyPet-debug.apk
          if-no-files-found: error
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: PyPet-release-unsigned-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
