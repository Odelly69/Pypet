name: Pypet Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'api/**'
      - 'package.json'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'api/**'
      - 'package.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Python test runner
        run: python -m pip install pytest
      - name: Run Python world and curriculum tests
        run: PYTHONPATH=app/src/main/python pytest app/src/test/python -q
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Verify debug APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Build production release APK
        run: gradle assembleRelease --stacktrace
      - name: Verify production release APK
        run: test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pypet-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload production release APK
        uses: actions/upload-artifact@v4
        with:
          name: pypet-android-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
